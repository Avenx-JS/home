<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avenx.js</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
            --muted-color: #888888;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        nav {
            padding: 0.9rem 0;
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 2rem;
            width: 100%;
        }

        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .links a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            font-size: 0.8rem;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .links a:hover {
            opacity: 1;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(to bottom, rgba(17, 17, 17, 0.26), rgba(0, 0, 0, 0.199)), url('media/hero.png');
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, var(--bg-color), transparent);
        }

        .hero-content {
            animation: fadeIn 1.2s ease-out forwards;
            z-index: 1;
        }

        h1 {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: -6px;
            line-height: 1;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heading-logo {
            height: 1.4em;
            width: auto;
            transform: translateY(-0.08em);
            margin-right: -0.15em;
        }



        p {
            font-size: 1.2rem;
            color: var(--text-color);
            font-weight: 400;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        footer {
            padding: 6rem 0 4rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 4rem;
        }

        .footer-info .logo {
            margin-bottom: 1rem;
        }

        .footer-info p {
            font-size: 0.8rem;
            text-transform: none;
            letter-spacing: normal;
            margin-bottom: 0;
        }

        .footer-group h3 {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .footer-group ul {
            list-style: none;
        }

        .footer-group ul li {
            margin-bottom: 0.8rem;
        }

        .footer-group ul li a {
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .footer-group ul li a:hover {
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 5.5rem;
                letter-spacing: -3px;
            }

            p {
                font-size: 0.9rem;
            }

            .links {
                display: none;
            }

            .footer-content {
                flex-direction: column;
                gap: 3rem;
            }
        }
    </style>
</head>

<body>
    <div class="grid-overlay"></div>
    <nav>
        <div class="container">
            <div class="logo">Avenx.js</div>
            <div class="links">
                <a href="https://github.com/avenx-js">GitHub</a>
                <a href="https://www.npmjs.com/package/avenx-core">npm</a>
                <a href="">Docs</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <div class="hero-content">
                <h1><img src="media/logo.svg" alt="A" class="heading-logo">venx.js</h1>
                <p>The Blazingly Fast Reactivity Framework.</p>
            </div>
        </div>
    </header>

    <main>
        
    </main>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <div class="logo">Avenx<span>.js</span></div>
                    <p>&copy; 2026 Avenx.js. All rights reserved.</p>
                </div>
                <div class="footer-links">
                    <div class="footer-group">
                        <h3>Developers</h3>
                        <ul>
                            <li><a href="https://avenx-js.github.io/dev-docs/">Dev Docs</a></li>
                            <li><a href="https://avenx-js.github.io/test-cov/">Test Coverage</a></li>
                            <li><a href="https://avenx-js.github.io/bench-results/">Benchmark Results</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
